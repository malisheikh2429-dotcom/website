</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

```
<!-- Login Form Container -->
<div class="w-full max-w-md bg-white rounded-lg shadow-md p-8 border border-gray-200">

    <!-- Heading -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-[#232F3E]">
            <i class="fa-solid fa-box-open text-[#FF9900]"></i>
            Warehouse
        </h1>

        <p class="text-gray-500 mt-2">
            Sign in to your account
        </p>
    </div>

    <!-- Login Form -->
    <form action="dashboard.html" method="post">

        <!-- Email -->
        <div class="mb-4">
            <label for="email"
                   class="block text-sm font-semibold text-gray-700 mb-1">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#FF9900]"
            >
        </div>

        <!-- Password -->
        <div class="mb-6">
            <label for="password"
                   class="block text-sm font-semibold text-gray-700 mb-1">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#FF9900]"
            >
        </div>

        <!-- Sign In Button -->
        <button
            type="submit"
            class="w-full amz-btn text-white font-bold py-2 px-4 rounded shadow hover:shadow-lg transition"
        >
            Sign In
        </button>

    </form>

    <!-- Signup Link -->
    <div class="mt-6 text-center text-sm text-gray-600">
        <p>
            Don't have an account?
            <a href="signup.html"
               class="text-[#007185] hover:underline">
                Sign up here
            </a>
        </p>
    </div>

</div>
```

</body>
</html>
