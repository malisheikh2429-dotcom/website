<!DOCTYPE html>
<html lang="en">

<head>

<title>Orders</title>

<body class="bg-gray-100">

<td class="p-4">

<td class="p-4">

<td class="p-4">

<tr class="border-t">

<td class="p-4">
#ORD-1002
</td>

<td class="p-4">

</td>

<td class="p-4">
July 27, 2026
</td>

<td class="p-4">
$99.99
</td>

<td class="p-4">

<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">

</span>

</td>

<td class="p-4">

<a href="order-details.html"
class="text-blue-600">

View

</a>
