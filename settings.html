<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="assets/css/style.css">

</head>

<body class="bg-gray-100">

<header class="bg-[#232F3E] text-white p-5">

<div class="max-w-5xl mx-auto flex justify-between">

<h1 class="font-bold text-xl">
Settings
</h1>

<a href="dashboard.html">
Dashboard
</a>

</div>

</header>

<main class="max-w-5xl mx-auto p-6">

<div class="bg-white rounded-xl shadow p-6">

<h2 class="text-2xl font-bold mb-6">
System Settings
</h2>

<div class="space-y-6">

<div class="flex justify-between items-center border-b pb-5">

<div>

<h3 class="font-bold">
Email Notifications
</h3>

<p class="text-gray-500">
Receive warehouse notifications by email.
</p>

</div>

<input type="checkbox" checked class="w-5 h-5">

</div>

<div class="flex justify-between items-center border-b pb-5">

<div>

<h3 class="font-bold">
Low Stock Alerts
</h3>

<p class="text-gray-500">
Notify when products reach low stock.
</p>

</div>

<input type="checkbox" checked class="w-5 h-5">

</div>

<div>

<label class="font-bold">
Language
</label>

<select class="block border rounded-lg p-3 mt-2">

<option>English</option>

<option>Urdu</option>

</select>

</div>

<button
class="amazon-orange text-white px-6 py-3 rounded-lg">

Save Settings

</button>

</div>

</div>

</main>

</body>

</html>
