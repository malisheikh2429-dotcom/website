<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Signup - Warehouse</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
        href="assets/css/style.css">

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-8">

        <div class="text-center mb-6">

            <i class="fa-solid fa-user-plus text-[#FF9900] text-4xl"></i>

            <h1 class="text-3xl font-bold text-[#232F3E] mt-3">
                Create Account
            </h1>

            <p class="text-gray-500">
                Register a new warehouse account
            </p>

        </div>

        <form action="dashboard.html">

            <div class="grid md:grid-cols-2 gap-4">

                <div>

                    <label class="font-semibold text-sm">
                        First Name
                    </label>

                    <input
                        type="text"
                        required
                        class="w-full border rounded-lg p-3 mt-2"
                        placeholder="First Name">

                </div>

                <div>

                    <label class="font-semibold text-sm">
                        Last Name
                    </label>

                    <input
                        type="text"
                        required
                        class="w-full border rounded-lg p-3 mt-2"
                        placeholder="Last Name">

                </div>

            </div>

            <div class="mt-4">

                <label class="font-semibold text-sm">
                    Email
                </label>

                <input
                    type="email"
                    required
                    class="w-full border rounded-lg p-3 mt-2"
                    placeholder="example@email.com">

            </div>

            <div class="mt-4">

                <label class="font-semibold text-sm">
                    Phone
                </label>

                <input
                    type="tel"
                    required
                    class="w-full border rounded-lg p-3 mt-2"
                    placeholder="+1 000 000 0000">

            </div>

            <div class="mt-4">

                <label class="font-semibold text-sm">
                    Password
                </label>

                <input
                    type="password"
                    required
                    minlength="6"
                    class="w-full border rounded-lg p-3 mt-2"
                    placeholder="Minimum 6 characters">

            </div>

            <div class="mt-4">

                <label class="font-semibold text-sm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    required
                    minlength="6"
                    class="w-full border rounded-lg p-3 mt-2"
                    placeholder="Confirm password">

            </div>

            <button
                class="w-full amazon-orange text-white py-3
                       rounded-lg font-bold mt-6">

                Create Account

            </button>

        </form>

        <p class="text-center mt-5 text-gray-600">

            Already have an account?

            <a href="login.html"
                class="text-blue-600 font-semibold">

                Login

            </a>

        </p>

    </div>

</body>
</html>
