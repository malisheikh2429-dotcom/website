<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stock Out</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="assets/css/style.css">

</head>

<body class="bg-gray-100">

<header class="bg-[#232F3E] text-white p-5">

<div class="max-w-5xl mx-auto flex justify-between">

<h1 class="font-bold text-xl">
Stock Out
</h1>

<a href="dashboard.html">
Dashboard
</a>

</div>

</header>

<main class="max-w-5xl mx-auto p-6">

<div class="bg-white rounded-xl shadow p-6">

<h2 class="text-2xl font-bold mb-6">
Record Stock Out
</h2>

<form>

<div class="grid md:grid-cols-2 gap-5">

<div>

<label>Product</label>

<select required
class="w-full border p-3 rounded-lg mt-2">

<option value="">
Select Product
</option>

<option>
Echo Dot
</option>

<option>
Kindle Paperwhite
</option>

</select>

</div>

<div>

<label>Quantity</label>

<input
type="number"
min="1"
required
class="w-full border p-3 rounded-lg mt-2">

</div>

<div>

<label>Reason</label>

<select class="w-full border p-3 rounded-lg mt-2">

<option>Order</option>

<option>Damaged</option>

<option>Other</option>

</select>

</div>

<div>

<label>Date</label>

<input
type="date"
required
class="w-full border p-3 rounded-lg mt-2">

</div>

</div>

<button
class="amazon-orange text-white px-6 py-3 rounded-lg mt-6">

Record Stock Out

</button>

</form>

</div>

</main>

</body>
</html>
