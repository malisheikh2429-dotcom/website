<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-gray-100">

<header class="bg-[#232F3E] text-white p-5">

<div class="max-w-6xl mx-auto flex justify-between">

<h1 class="font-bold text-xl">Suppliers</h1>

<a href="dashboard.html">
Dashboard
</a>

</div>

</header>

<main class="max-w-6xl mx-auto p-6">

<div class="flex justify-between mb-6">

<h1 class="text-3xl font-bold">
Supplier Management
</h1>

<button
onclick="openModal('supplierModal')"
class="amazon-orange text-white px-5 py-3 rounded-lg">

Add Supplier

</button>

</div>

<div class="bg-white rounded-xl shadow overflow-x-auto">

<table class="w-full">

<thead class="bg-gray-100">

<tr>

<th class="p-4 text-left">ID</th>

<th class="p-4 text-left">Supplier</th>

<th class="p-4 text-left">Contact</th>

<th class="p-4 text-left">Phone</th>

<th class="p-4 text-left">Status</th>

</tr>

</thead>

<tbody>

<tr class="border-t">

<td class="p-4">
SUP-001
</td>

<td class="p-4">
ABC Suppliers
</td>

<td class="p-4">
contact@abc.com
</td>

<td class="p-4">
+1 555 123456
</td>

<td class="p-4">
<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">
Active
</span>
</td>

</tr>

<tr class="border-t">

<td class="p-4">
SUP-002
</td>

<td class="p-4">
Global Traders
</td>

<td class="p-4">
info@global.com
</td>

<td class="p-4">
+1 555 456789
</td>

<td class="p-4">
<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">
Active
</span>
</td>

</tr>

</tbody>

</table>

</div>

</main>

<div id="supplierModal"
class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-5">

<div class="bg-white p-6 rounded-xl w-full max-w-md">

<h2 class="text-xl font-bold mb-4">
Add Supplier
</h2>

<form>

<input
required
placeholder="Supplier Name"
class="w-full border p-3 rounded-lg mb-3">

<input
required
type="email"
placeholder="Email"
class="w-full border p-3 rounded-lg mb-3">

<input
required
placeholder="Phone"
class="w-full border p-3 rounded-lg mb-4">

<button
class="amazon-orange text-white px-5 py-3 rounded-lg">
Save
</button>

<button
type="button"
onclick="closeModal('supplierModal')"
class="border px-5 py-3 rounded-lg">
Cancel
</button>

</form>

</div>

</div>

<script src="assets/js/script.js"></script>

</body>
</html>
